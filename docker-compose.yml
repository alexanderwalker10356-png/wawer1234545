services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: whitelabel-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
    volumes:
      - bot-data:/app/data
      - ./white-label:/app/white-label:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
